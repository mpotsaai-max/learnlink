<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Profile — LearnLink</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .payment-step { display: none; }
  .payment-step.active { display: block; animation: fadeIn 0.3s ease; }
  .booking-step { display: none; }
  .booking-step.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .payment-box {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1.5rem;
    margin-top: 1rem;
  }
  .payment-method {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .payment-method:hover, .payment-method.selected {
    border-color: #3b82f6;
    background: #172554;
  }
  .payment-method input { width: auto; margin: 0; }
  .payment-method strong { color: #e2e8f0; display: block; }
  .payment-method small { color: #94a3b8; }

  .warning-box {
    background: #451a1a;
    border: 1px solid #b91c1c;
    border-left: 4px solid #ef4444;
    color: #fecaca;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }
  .warning-box strong { color: #f87171; }

  .info-box {
    background: #0c2e4e;
    border: 1px solid #1d4ed8;
    border-left: 4px solid #3b82f6;
    color: #bfdbfe;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }

  .refund-box {
    background: #064e3b;
    border: 1px solid #059669;
    border-left: 4px solid #10b981;
    color: #a7f3d0;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }

  .whatsapp-box {
    background: #064e3b;
    border: 1px solid #10b981;
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
    margin: 1rem 0;
  }
  .whatsapp-box a {
    color: #34d399;
    font-weight: 600;
    text-decoration: none;
    font-size: 1.1rem;
  }

  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    margin: 1rem 0;
    font-size: 0.9rem;
    color: #cbd5e1;
  }
  .checkbox-row input { width: auto; margin-top: 2px; }

  .step-indicator {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .step-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #334155;
  }
  .step-dot.active { background: #3b82f6; }

  .price-tag {
    font-size: 1.5rem;
    font-weight: 700;
    color: #3b82f6;
  }
  .price-tag span { font-size: 0.9rem; color: #94a3b8; font-weight: 400; }

  .btn-outline {
    background: transparent;
    border: 1px solid #475569;
    color: #cbd5e1;
  }
  .btn-outline:hover { background: #334155; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="container nav-content">
    <a href="/" class="logo">LearnLink</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>
</nav>

<div class="container" style="padding-top: 2rem;">
  <div id="tutorProfile"></div>
</div>

<footer class="footer" style="margin-top: 3rem; padding: 2rem 0; border-top: 1px solid #334155; text-align: center; color: #94a3b8; font-size: 0.9rem;">
  <div class="container">
    <p>LearnLink — Connecting students with great tutors across Botswana.</p>
    <p style="margin-top: 0.5rem;">
      <a href="/" style="color: #94a3b8; margin: 0 0.5rem;">Home</a>
      <a href="/terms.html" style="color: #94a3b8; margin: 0 0.5rem;">Terms & Conditions</a>
      <a href="mailto:hello@learnlink.bw" style="color: #94a3b8; margin: 0 0.5rem;">hello@learnlink.bw</a>
    </p>
  </div>
</footer>

<script src="/js/app.js"></script>
<script>
const tutorId = new URLSearchParams(window.location.search).get('id');
let tutorData = null;
let selectedPackage = null;

async function loadTutor() {
  if (!tutorId) return document.getElementById('tutorProfile').innerHTML = '<p>Tutor not found.</p>';
  try {
    const res = await fetch(`/api/tutors/${tutorId}`);
    if (!res.ok) throw new Error('Not found');
    tutorData = await res.json();
    renderTutor(tutorData);
  } catch (e) {
    document.getElementById('tutorProfile').innerHTML = '<p>Tutor not found.</p>';
  }
}

function renderTutor(t) {
  const subjects = t.subjects.split(',').map(s => `<span class="tag">${s.trim()}</span>`).join('');
  const levels = t.levels.split(',').map(l => `<span class="tag tag-outline">${l.trim()}</span>`).join('');
  const commissionRate = 0.15;
  const tutorReceives = Math.round(t.price_per_hour * (1 - commissionRate));

  document.getElementById('tutorProfile').innerHTML = `
    <div style="display: grid; grid-template-columns: 1fr; gap: 2rem;">
      <div class="card">
        <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
          <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: white;">
            ${t.full_name.charAt(0)}
          </div>
          <div>
            <h1 style="margin: 0;">${t.full_name}</h1>
            <p style="margin: 0.25rem 0 0; color: #94a3b8;">${t.location} · ${t.education || 'Verified Tutor'}</p>
          </div>
        </div>
        <p style="color: #cbd5e1; line-height: 1.7;">${t.bio}</p>
        <div style="margin-top: 1rem;">${subjects}</div>
        <div style="margin-top: 0.5rem;">${levels}</div>
        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #334155;">
          <div class="price-tag">P${t.price_per_hour} <span>/ hour</span></div>
          <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">Secure booking · Online video session · Verified tutor</p>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-bottom: 1rem;">Book a Session</h2>

        <!-- Tabs -->
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem;">
          <button id="tabSession" class="btn btn-primary" style="flex:1;" onclick="switchTab('session')">Single Session</button>
          <button id="tabPackage" class="btn btn-outline" style="flex:1;" onclick="switchTab('package')">Monthly Package</button>
        </div>

        <!-- SINGLE SESSION FLOW -->
        <div id="sessionFlow">
          <div class="step-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
          </div>

          <!-- STEP 1: Session Details -->
          <div id="step1" class="booking-step active">
            <div class="form-group">
              <label>Subject</label>
              <select id="subjectSelect" class="form-control">
                <option value="">Select subject</option>
                ${t.subjects.split(',').map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Level</label>
              <select id="levelSelect" class="form-control">
                <option value="">Select level</option>
                ${t.levels.split(',').map(l => `<option value="${l.trim()}">${l.trim()}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="sessionDate" class="form-control" min="${new Date().toISOString().split('T')[0]}">
            </div>
            <div class="form-group">
              <label>Available Time Slots</label>
              <select id="sessionTime" class="form-control" disabled>
                <option>Pick a date first</option>
              </select>
              <small id="slotMsg" style="color: #64748b;"></small>
            </div>
            <div class="form-group">
              <label>Notes for tutor (optional)</label>
              <textarea id="sessionNotes" class="form-control" rows="2" placeholder="What topic? Any special requests?"></textarea>
            </div>
            <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
              <button class="btn btn-primary" style="flex:1;" onclick="goToPayment()">Next: Payment →</button>
            </div>
          </div>

          <!-- STEP 2: Payment -->
          <div id="step2" class="booking-step">
            <div class="warning-box">
              <strong>⚠️ Do NOT pay the tutor directly.</strong><br>
              For your security, all payments must go through LearnLink. We hold the funds and pay the tutor after the session is completed. Never send money to a tutor's personal number.
            </div>

            <div class="payment-box">
              <h3 style="margin-bottom: 0.5rem;">Booking Summary</h3>
              <p style="color: #94a3b8; margin: 0;">
                Tutor: <strong style="color: #e2e8f0;">${t.full_name}</strong><br>
                Subject: <strong style="color: #e2e8f0;" id="paySubject"></strong><br>
                Date: <strong style="color: #e2e8f0;" id="payDate"></strong><br>
                Time: <strong style="color: #e2e8f0;" id="payTime"></strong>
              </p>
              <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #334155;">
                <div class="price-tag" id="payAmount">P${t.price_per_hour} <span>/ session</span></div>
                <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">You pay this amount to LearnLink. Tutor receives P${tutorReceives} after 15% platform fee.</p>
              </div>
            </div>

            <h3 style="margin: 1.5rem 0 0.75rem;">How to Pay</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem;">Choose one method and send the exact amount to the number below.</p>

            <div class="payment-method selected" onclick="selectMethod(this, 'OrangeMoney')">
              <input type="radio" name="payMethod" value="OrangeMoney" checked>
              <div>
                <strong>OrangeMoney</strong>
                <small>Send to: <strong style="color: #e2e8f0;">+267 78 008 555</strong></small>
              </div>
            </div>
            <div class="payment-method" onclick="selectMethod(this, 'MyZaka')">
              <input type="radio" name="payMethod" value="MyZaka">
              <div>
                <strong>MyZaka (Mascom)</strong>
                <small>Send to: <strong style="color: #e2e8f0;">+267 78 008 555</strong></small>
              </div>
            </div>
            <div class="payment-method" onclick="selectMethod(this, 'Smega')">
              <input type="radio" name="payMethod" value="Smega">
              <div>
                <strong>Smega</strong>
                <small>Send to: <strong style="color: #e2e8f0;">+267 78 008 555</strong></small>
              </div>
            </div>

            <div class="whatsapp-box">
              <p style="margin: 0 0 0.5rem; color: #a7f3d0;">📱 After paying, send your payment screenshot to:</p>
              <a href="https://wa.me/26778008555" target="_blank">WhatsApp +267 78 008 555</a>
              <p style="margin: 0.5rem 0 0; font-size: 0.85rem; color: #6ee7b7;">Include your name and the tutor's name in the message for faster processing.</p>
            </div>

            <div class="refund-box">
              <strong>💰 Refund Guarantee</strong><br>
              If the tutor is unavailable or cancels for any reason, you will receive a <strong>full refund</strong> within 24 hours. Your money is safe with LearnLink.
            </div>

            <div class="checkbox-row">
              <input type="checkbox" id="paymentConfirm">
              <label for="paymentConfirm">I confirm that I have made payment using the selected method and sent the proof/screenshot to the WhatsApp number above.</label>
            </div>

            <div id="payError" style="color: #f87171; font-size: 0.9rem; margin-bottom: 0.75rem; display: none;">
              Please confirm payment above to continue.
            </div>

            <div style="display: flex; gap: 0.75rem;">
              <button class="btn btn-outline" style="flex:1;" onclick="goBack()">← Back</button>
              <button class="btn btn-primary" style="flex:2;" onclick="submitBooking()">Submit Booking Request</button>
            </div>
          </div>
        </div>

        <!-- MONTHLY PACKAGE FLOW -->
        <div id="packageFlow" style="display:none;">
          ${t.packages && t.packages.length ? t.packages.map(pkg => `
            <div class="card" style="margin-bottom: 1rem; border: 1px solid #334155;">
              <h3 style="margin-bottom: 0.5rem;">${pkg.name}</h3>
              <p style="color: #94a3b8; font-size: 0.9rem;">${pkg.description || ''}</p>
              <p style="color: #94a3b8; font-size: 0.9rem;">Subjects: ${pkg.subjects} · Levels: ${pkg.levels}</p>
              <div style="margin: 0.75rem 0;">
                <span class="price-tag">P${pkg.price_per_month} <span>/ month</span></span>
                <span style="color: #64748b; font-size: 0.85rem;"> (${pkg.sessions_included} sessions)</span>
              </div>
              <button class="btn btn-primary" onclick="subscribePackage(${pkg.id}, ${pkg.price_per_month}, '${pkg.name}')">Subscribe & Pay</button>
            </div>
          `).join('') : '<p style="color: #64748b;">No monthly packages available from this tutor yet.</p>'}
        </div>
      </div>
    </div>
  `;

  // Date change listener
  document.getElementById('sessionDate').addEventListener('change', loadSlots);
}

function switchTab(tab) {
  const sFlow = document.getElementById('sessionFlow');
  const pFlow = document.getElementById('packageFlow');
  const tSession = document.getElementById('tabSession');
  const tPackage = document.getElementById('tabPackage');
  if (tab === 'session') {
    sFlow.style.display = 'block';
    pFlow.style.display = 'none';
    tSession.className = 'btn btn-primary'; tSession.style.flex = '1';
    tPackage.className = 'btn btn-outline'; tPackage.style.flex = '1';
  } else {
    sFlow.style.display = 'none';
    pFlow.style.display = 'block';
    tSession.className = 'btn btn-outline'; tSession.style.flex = '1';
    tPackage.className = 'btn btn-primary'; tPackage.style.flex = '1';
  }
}

async function loadSlots() {
  const date = document.getElementById('sessionDate').value;
  const timeSelect = document.getElementById('sessionTime');
  const msg = document.getElementById('slotMsg');
  if (!date) { timeSelect.innerHTML = '<option>Pick a date first</option>'; timeSelect.disabled = true; return; }
  timeSelect.disabled = true;
  msg.textContent = 'Loading available slots...';
  try {
    const res = await fetch(`/api/tutors/${tutorId}/availability?date=${date}`);
    const data = await res.json();
    if (data.slots && data.slots.length) {
      timeSelect.innerHTML = '<option value="">Select a time</option>' + data.slots.map(s => `<option value="${s}">${s}</option>`).join('');
      timeSelect.disabled = false;
      msg.textContent = `${data.slots.length} slot(s) available`;
      msg.style.color = '#34d399';
    } else {
      timeSelect.innerHTML = '<option>No slots available</option>';
      msg.textContent = 'No available slots for this date. Try another day.';
      msg.style.color = '#f87171';
    }
  } catch (e) {
    timeSelect.innerHTML = '<option>Error loading slots</option>';
    msg.textContent = 'Could not load availability.';
  }
}

function goToPayment() {
  const subject = document.getElementById('subjectSelect').value;
  const level = document.getElementById('levelSelect').value;
  const date = document.getElementById('sessionDate').value;
  const time = document.getElementById('sessionTime').value;

  if (!subject || !level || !date || !time) {
    alert('Please fill in all fields before proceeding to payment.');
    return;
  }

  document.getElementById('paySubject').textContent = subject + ' (' + level + ')';
  document.getElementById('payDate').textContent = date;
  document.getElementById('payTime').textContent = time;

  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('dot1').classList.remove('active');
  document.getElementById('dot2').classList.add('active');
}

function goBack() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  document.getElementById('dot2').classList.remove('active');
  document.getElementById('dot1').classList.add('active');
  document.getElementById('payError').style.display = 'none';
}

function selectMethod(el, val) {
  document.querySelectorAll('.payment-method').forEach(m => { m.classList.remove('selected'); m.querySelector('input').checked = false; });
  el.classList.add('selected');
  el.querySelector('input').checked = true;
}

async function submitBooking() {
  const confirmed = document.getElementById('paymentConfirm').checked;
  if (!confirmed) {
    document.getElementById('payError').style.display = 'block';
    return;
  }
  document.getElementById('payError').style.display = 'none';

  const subject = document.getElementById('subjectSelect').value;
  const level = document.getElementById('levelSelect').value;
  const date = document.getElementById('sessionDate').value;
  const time = document.getElementById('sessionTime').value;
  const notes = document.getElementById('sessionNotes').value;
  const method = document.querySelector('input[name="payMethod"]:checked').value;

  try {
    const res = await apiFetch('/api/bookings', {
      method: 'POST',
      body: JSON.stringify({
        tutor_id: parseInt(tutorId),
        booking_type: 'session',
        subject: subject + ' — ' + level,
        session_date: date,
        session_time: time,
        notes: notes + ' | Payment: ' + method + ' | Proof sent to WhatsApp +26778008555'
      })
    });
    if (res.ok) {
      alert('Booking request submitted! Your tutor will confirm shortly. Remember to send your payment screenshot to WhatsApp +267 78 008 555 if you haven\'t already.');
      window.location.href = '/dashboard.html';
    } else {
      const data = await res.json();
      alert(data.error || 'Failed to submit booking.');
    }
  } catch (e) {
    alert('Network error. Please try again.');
  }
}

async function subscribePackage(packageId, price, name) {
  const confirmPay = confirm(
    `Subscribe to "${name}" for P${price}/month?\n\n` +
    `IMPORTANT: You must pay LearnLink directly — NOT the tutor.\n` +
    `Send P${price} via OrangeMoney, MyZaka, or Smega to +267 78 008 555.\n` +
    `Then send your proof/screenshot to WhatsApp +267 78 008 555.\n\n` +
    `If the tutor is unavailable, you will receive a full refund.\n\n` +
    `Click OK to proceed after payment.`
  );
  if (!confirmPay) return;

  const startDate = prompt('Enter start date (YYYY-MM-DD):', new Date().toISOString().split('T')[0]);
  if (!startDate) return;

  try {
    const res = await apiFetch('/api/subscriptions', {
      method: 'POST',
      body: JSON.stringify({ tutor_id: parseInt(tutorId), package_id: packageId, start_date: startDate })
    });
    if (res.ok) {
      alert('Subscription created! Please send your payment proof to WhatsApp +267 78 008 555.');
      window.location.href = '/dashboard.html';
    } else {
      const data = await res.json();
      alert(data.error || 'Failed to subscribe.');
    }
  } catch (e) {
    alert('Network error. Please try again.');
  }
}

// Auth guard
if (!localStorage.getItem('token')) {
  window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
}

document.getElementById('logoutBtn').addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '/';
});

loadTutor();
</script>
</body>
</html>
