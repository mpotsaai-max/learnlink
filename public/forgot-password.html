<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — LearnLink</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-container { max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
  .auth-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2rem; }
  .auth-card h1 { text-align: center; margin-bottom: 0.25rem; font-size: 1.4rem; }
  .auth-card p.sub { text-align: center; color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #cbd5e1; }
  .form-control { width: 100%; padding: 0.7rem 0.9rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 1rem; }
  .form-control:focus { outline: none; border-color: #3b82f6; }
  .btn { width: 100%; padding: 0.8rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
  .auth-footer { text-align: center; margin-top: 1.25rem; color: #94a3b8; font-size: 0.9rem; }
  .auth-footer a { color: #60a5fa; text-decoration: none; }
  .alert { padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  .alert-error { background: #451a1a; color: #fecaca; border: 1px solid #b91c1c; }
  .alert-success { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
  .token-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin: 1rem 0; word-break: break-all; font-family: monospace; font-size: 0.85rem; color: #60a5fa; }
  .copy-btn { background: #334155; color: #e2e8f0; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-top: 0.5rem; }
  .copy-btn:hover { background: #475569; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="container nav-content">
    <a href="/" class="logo">LearnLink</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/login.html">Log in</a>
    </div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">Enter your email and we'll generate a reset token for you.</p>
    <div id="alertBox" class="alert"></div>
    <form id="forgotForm">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary">Send Reset Token</button>
    </form>
    <div id="tokenResult" style="display:none;">
      <p style="color:#a7f3d0; font-size:0.9rem; margin:1rem 0 0.5rem;">✅ Token generated! Copy it below and use it on the reset page.</p>
      <div class="token-box" id="tokenValue"></div>
      <button class="copy-btn" onclick="copyToken()">Copy Token</button>
      <p style="margin-top:1rem; text-align:center;">
        <a href="/reset-password.html" style="color:#60a5fa; text-decoration:none;">Go to Reset Password →</a>
      </p>
    </div>
    <div class="auth-footer">
      Remember your password? <a href="/login.html">Log in</a>
    </div>
  </div>
</div>

<footer style="text-align:center; padding:2rem; color:#64748b; font-size:0.85rem; border-top:1px solid #334155; margin-top:3rem;">
  <a href="/" style="color:#94a3b8; margin:0 0.5rem;">Home</a>
  <a href="/terms.html" style="color:#94a3b8; margin:0 0.5rem;">Terms & Conditions</a>
</footer>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  alertBox.style.display = 'none';
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('tokenValue').textContent = data.token;
      document.getElementById('tokenResult').style.display = 'block';
      document.getElementById('forgotForm').style.display = 'none';
    } else {
      alertBox.className = 'alert alert-error';
      alertBox.textContent = data.error || 'Something went wrong';
      alertBox.style.display = 'block';
    }
  } catch (err) {
    alertBox.className = 'alert alert-error';
    alertBox.textContent = 'Network error. Please try again.';
    alertBox.style.display = 'block';
  }
});

function copyToken() {
  const token = document.getElementById('tokenValue').textContent;
  navigator.clipboard.writeText(token).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy Token', 1500);
  });
}
</script>
</body>
</html>
