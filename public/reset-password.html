<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — LearnLink</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-container { max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
  .auth-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2rem; }
  .auth-card h1 { text-align: center; margin-bottom: 0.25rem; font-size: 1.4rem; }
  .auth-card p.sub { text-align: center; color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #cbd5e1; }
  .form-control { width: 100%; padding: 0.7rem 0.9rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 1rem; }
  .form-control:focus { outline: none; border-color: #3b82f6; }
  .btn { width: 100%; padding: 0.8rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
  .auth-footer { text-align: center; margin-top: 1.25rem; color: #94a3b8; font-size: 0.9rem; }
  .auth-footer a { color: #60a5fa; text-decoration: none; }
  .alert { padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  .alert-error { background: #451a1a; color: #fecaca; border: 1px solid #b91c1c; }
  .alert-success { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="container nav-content">
    <a href="/" class="logo">LearnLink</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/login.html">Log in</a>
    </div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h1>Create new password</h1>
    <p class="sub">Paste your reset token and choose a new password</p>
    <div id="alertBox" class="alert"></div>
    <form id="resetForm">
      <div class="form-group">
        <label>Reset Token</label>
        <input type="text" id="token" class="form-control" placeholder="Paste your token here" required>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
    <div class="auth-footer">
      <a href="/forgot-password.html">Get a new token</a> · <a href="/login.html">Log in</a>
    </div>
  </div>
</div>

<footer style="text-align:center; padding:2rem; color:#64748b; font-size:0.85rem; border-top:1px solid #334155; margin-top:3rem;">
  <a href="/" style="color:#94a3b8; margin:0 0.5rem;">Home</a>
  <a href="/terms.html" style="color:#94a3b8; margin:0 0.5rem;">Terms & Conditions</a>
</footer>

<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  alertBox.style.display = 'none';

  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;
  if (newPass !== confirmPass) {
    alertBox.className = 'alert alert-error';
    alertBox.textContent = 'Passwords do not match.';
    alertBox.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('token').value, new_password: newPass })
    });
    const data = await res.json();
    if (res.ok) {
      alertBox.className = 'alert alert-success';
      alertBox.textContent = data.message + ' Redirecting to login...';
      alertBox.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(() => window.location.href = '/login.html', 2000);
    } else {
      alertBox.className = 'alert alert-error';
      alertBox.textContent = data.error || 'Reset failed';
      alertBox.style.display = 'block';
    }
  } catch (err) {
    alertBox.className = 'alert alert-error';
    alertBox.textContent = 'Network error. Please try again.';
    alertBox.style.display = 'block';
  }
});
</script>
</body>
</html>
