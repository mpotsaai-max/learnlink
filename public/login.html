<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — LearnLink</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-container { max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
  .auth-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2rem; }
  .auth-card h1 { text-align: center; margin-bottom: 0.25rem; }
  .auth-card p.sub { text-align: center; color: #94a3b8; margin-bottom: 1.5rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #cbd5e1; }
  .form-control { width: 100%; padding: 0.7rem 0.9rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 1rem; }
  .form-control:focus { outline: none; border-color: #3b82f6; }
  .btn { width: 100%; padding: 0.8rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
  .btn-primary:hover { opacity: 0.92; }
  .auth-footer { text-align: center; margin-top: 1.25rem; color: #94a3b8; font-size: 0.9rem; }
  .auth-footer a { color: #60a5fa; text-decoration: none; }
  .auth-footer a:hover { text-decoration: underline; }
  .forgot-row { text-align: right; margin-top: -0.5rem; margin-bottom: 1rem; }
  .forgot-row a { color: #60a5fa; font-size: 0.85rem; text-decoration: none; }
  .forgot-row a:hover { text-decoration: underline; }
  .alert { padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  .alert-error { background: #451a1a; color: #fecaca; border: 1px solid #b91c1c; }
  .alert-success { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="container nav-content">
    <a href="/" class="logo">LearnLink</a>
    <div class="nav-links" id="nav-links">
      <a href="/">Home</a>
      <a href="/register.html">Sign up</a>
    </div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your LearnLink account</p>
    <div id="alertBox" class="alert"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="forgot-row">
        <a href="/forgot-password.html">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="/register.html">Sign up</a>
    </div>
  </div>
</div>

<footer style="text-align:center; padding:2rem; color:#64748b; font-size:0.85rem; border-top:1px solid #334155; margin-top:3rem;">
  <a href="/" style="color:#94a3b8; margin:0 0.5rem;">Home</a>
  <a href="/terms.html" style="color:#94a3b8; margin:0 0.5rem;">Terms & Conditions</a>
</footer>

<script src="/js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const alertBox = document.getElementById('alertBox');

  try {
    const data = await auth.login({email, password});
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/';
  } catch (err) {
    alertBox.className = 'alert alert-error';
    alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
    alertBox.style.display = 'block';
  }
});
</script>
</body>
</html>
